<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carros</title>
</head>

<style>

    .img-pequena {
        width: 30%;
        height: 250px;
        object-fit: cover;
    }

    img {
        border-radius: 20%;
        border: 30px dashed yellow;
    }

    .img-destaque {
        height: 500px;
        width: 100%;
        object-fit: cover;
    }

    .div-imagens {
        margin-top: 30px;
        border: 2px solid rgb(3, 19, 244);
        display: flex;
        justify-content: space-between;
    }

    body {
        background-color: rgb(5, 6, 6);
    }
</style>

<body>
    
<div class="div-imagens">
    <img class="img-destaque" src="f1siena.jpg" alt="foto do melhor carro">
</div>

<div class="div-imagens">
    <img class="img-pequena" src="f2palio.jpg" alt="">
    <img class="img-pequena" src="f3creta.jpg" alt="">
    <img class="img-pequena" src="f4aston.jpg" alt="">
</div>

</body>

</html>
